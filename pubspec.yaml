name: mindgalaxy
description: Flutter Web app with emoji central star and popping thought stars
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  share_plus: ^7.2.2
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  universal_html: ^2.2.4
  flutter_localizations:
    sdk: flutter
  intl: any
  google_mobile_ads: ^4.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

  hive_generator: ^2.0.1
  build_runner: ^2.4.6

# Transitive (path_provider_windows / share_plus); 5.1.x breaks on current Dart (UnmodifiableUint8ListView).
dependency_overrides:
  win32: ^5.10.0
  # google_mobile_ads pins webview 4.5 → old android impl uses removed v1 Registrar API on current Flutter SDK.
  webview_flutter_android: ^4.12.0
  # url_launcher 6.3.x can still resolve stale android embedder.
  url_launcher_android: ^6.3.16

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/app_icon_512.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon_512.png
  adaptive_icon_background: "#000B1E" 
  adaptive_icon_foreground: "assets/icon/app_icon_512.png" 