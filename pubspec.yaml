name: mindgalaxy
description: Flutter Web app with emoji central star and popping thought stars
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  share_plus: ^7.2.2
  screenshot: ^2.5.0
  path_provider: ^2.1.3
  universal_html: ^2.2.4
  flutter_localizations:
    sdk: flutter
  intl: any
  google_mobile_ads: ^4.0.0
  url_launcher: ^6.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/app_icon.png
    - assets/docs/privacy_policy.md

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#000B1E" 
  adaptive_icon_foreground: "assets/icon/app_icon.png" 